name: Gateway Client One Time Hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gateway-client-hotfix.yml

permissions:
  contents: write

jobs:
  patch-main-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch src/main.jsx
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p = Path('src/main.jsx')
          s = p.read_text(encoding='utf-8')

          def one(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing target: {label}')
              s = s.replace(old, new, 1)

          one("import React, { useEffect, useMemo, useState } from 'react';",
              "import React, { useEffect, useMemo, useRef, useState } from 'react';",
              'import useRef')

          one("function OverviewContent({ client, websites, stats, portalData, websiteMessage, checkoutMessage, response, onAddWebsite, onRenewWebsite, onVerifyPayment, onPollPaymentStatus }) {",
              "function OverviewContent({ client, websites, stats, portalData, websiteMessage, checkoutMessage, response, onAddWebsite, onRenewWebsite, onEditWebsite, onVerifyPayment, onPollPaymentStatus }) {",
              'OverviewContent prop')

          one("  const [submitting, setSubmitting] = useState(false);\n  useEffect(() => { if (!form.websiteId && websites[0]?.id) setForm((current) => ({ ...current, websiteId: websites[0].id })); }, [websites, form.websiteId]);",
              "  const [submitting, setSubmitting] = useState(false);\n  const popupRunRef = useRef(0);\n  useEffect(() => { if (!form.websiteId && websites[0]?.id) setForm((current) => ({ ...current, websiteId: websites[0].id })); }, [websites, form.websiteId]);",
              'popupRunRef')

          s = re.sub(r"  useEffect\(\(\) => \{\n    if \(!popupOpen \|\| popupStep !== 'waiting'\) return undefined;\n    setCountdown\(120\);\n    const timer = window\.setInterval\(\(\) => \{\n      setCountdown\(\(current\) => \{\n        if \(current <= 1\) \{\n          window\.clearInterval\(timer\);\n          setPopupStep\('failed'\);\n          setPopupMessage\('Payment failed\. No matching Android SMS arrived within 2 minutes\.'\);\n          return 0;\n        \}\n        return current - 1;\n      \}\);\n    \}, 1000\);\n    return \(\) => window\.clearInterval\(timer\);\n  \}, \[popupOpen, popupStep\]\);",
          """  useEffect(() => {
    if (!popupOpen || popupStep !== 'waiting') return undefined;

    const runId = popupRunRef.current;
    setCountdown(120);

    const timer = window.setInterval(() => {
      setCountdown((current) => {
        if (popupRunRef.current !== runId) {
          window.clearInterval(timer);
          return current;
        }

        if (current <= 1) {
          window.clearInterval(timer);
          popupRunRef.current += 1;
          setPopupStep('failed');
          setPopupMessage('Payment failed. No matching Android SMS arrived within 2 minutes.');
          return 0;
        }

        return current - 1;
      });
    }, 1000);

    return () => window.clearInterval(timer);
  }, [popupOpen, popupStep]);""", s, count=1)

          s = re.sub(r"  async function waitForServerConfirmation\(requestId\) \{\n    if \(!requestId \|\| !onPollStatus\) return null;\n    for \(let attempt = 0; attempt < 60; attempt \+= 1\) \{\n      await new Promise\(\(resolve\) => window\.setTimeout\(resolve, 2000\)\);\n      const data = await onPollStatus\(\{ websiteId: form\.websiteId, requestId \}\);\n      const status = String\(data\?\.status \|\| ''\)\.toLowerCase\(\);\n      if \(\['verified', 'manual_accepted', 'already_verified'\]\.includes\(status\)\) return data;\n      if \(\['failed', 'rejected', 'expired'\]\.includes\(status\)\) return \{ success: false, error: data\?\.message \|\| data\?\.error \|\| 'Payment failed\.', \.\.\.data \};\n    \}\n    return \{ success: false, error: 'Payment failed\. No matching Android SMS arrived within 2 minutes\.' \};\n  \}",
          """  async function waitForServerConfirmation(requestId, runId) {
    if (!requestId || !onPollStatus) return null;

    for (let attempt = 0; attempt < 60; attempt += 1) {
      if (popupRunRef.current !== runId) return null;

      await new Promise((resolve) => window.setTimeout(resolve, 2000));

      if (popupRunRef.current !== runId) return null;

      const data = await onPollStatus({ websiteId: form.websiteId, requestId });
      const status = String(data?.status || '').toLowerCase();
      if (['verified', 'manual_accepted', 'already_verified'].includes(status)) return data;
      if (['failed', 'rejected', 'expired'].includes(status)) return { success: false, error: data?.message || data?.error || 'Payment failed.', ...data };
    }

    return { success: false, error: 'Payment failed. No matching Android SMS arrived within 2 minutes.' };
  }""", s, count=1)

          one("""  function openPopup() {
    setPopupStep('methods');
    setPopupMessage('');
    setSubmitting(false);
    setPopupOpen(true);
  }""",
          """  function openPopup() {
    popupRunRef.current += 1;
    setPopupStep('methods');
    setPopupMessage('');
    setSubmitting(false);
    setPopupOpen(true);
  }""", 'openPopup')

          old_submit = """  async function submitPopup() {
    setSubmitting(true);
    setPopupStep('waiting');
    setPopupMessage('Android SMS listener is waiting for sender number, amount, and receive time match.');
    const result = await onSubmit({ ...form, payerNumber: cleanPayerNumber, paymentTime: new Date().toISOString(), walletProvider: selectedWallet?.provider || selectedWallet?.id, receiverNumber: selectedWallet?.number || '' });
    setSubmitting(false);
    if (!result?.success) {
      setPopupStep('failed');
      setPopupMessage(result?.error || result?.message || 'Payment verification failed.');
      return;
    }
    const status = String(result.status || '').toLowerCase();
    if (['verified', 'manual_accepted', 'already_verified'].includes(status)) {
      setPopupStep('success');
      setPopupMessage(paymentVerificationMessage(result));
    } else {
      setPopupMessage(result.message || 'Waiting for Android SMS confirmation. This popup will fail after 2 minutes without a matching SMS.');
      const requestId = result.pendingVerification?.id || result.requestId;
      const finalResult = await waitForServerConfirmation(requestId);
      if (!finalResult || popupStep === 'failed') return;
      if (finalResult.success && ['verified', 'manual_accepted', 'already_verified'].includes(String(finalResult.status || '').toLowerCase())) {
        setPopupStep('success');
        setPopupMessage(paymentVerificationMessage(finalResult));
      } else {
        setPopupStep('failed');
        setPopupMessage(finalResult.error || finalResult.message || 'Payment failed.');
      }
    }
  }"""
          new_submit = """  async function submitPopup() {
    const runId = popupRunRef.current + 1;
    popupRunRef.current = runId;

    setSubmitting(true);
    setPopupStep('waiting');
    setPopupMessage('Android SMS listener is waiting for sender number, amount, and receive time match.');

    try {
      const result = await onSubmit({
        ...form,
        payerNumber: cleanPayerNumber,
        paymentTime: new Date().toISOString(),
        walletProvider: selectedWallet?.provider || selectedWallet?.id,
        receiverNumber: selectedWallet?.number || ''
      });

      if (popupRunRef.current !== runId) return;

      if (!result?.success) {
        setPopupStep('failed');
        setPopupMessage(result?.error || result?.message || 'Payment verification failed.');
        return;
      }

      const status = String(result.status || '').toLowerCase();
      if (['verified', 'manual_accepted', 'already_verified'].includes(status)) {
        setPopupStep('success');
        setPopupMessage(paymentVerificationMessage(result));
        return;
      }

      setPopupMessage(result.message || 'Waiting for Android SMS confirmation. This popup will fail after 2 minutes without a matching SMS.');
      const requestId = result.pendingVerification?.id || result.requestId;
      const finalResult = await waitForServerConfirmation(requestId, runId);

      if (popupRunRef.current !== runId || !finalResult) return;

      if (finalResult.success && ['verified', 'manual_accepted', 'already_verified'].includes(String(finalResult.status || '').toLowerCase())) {
        setPopupStep('success');
        setPopupMessage(paymentVerificationMessage(finalResult));
      } else {
        setPopupStep('failed');
        setPopupMessage(finalResult.error || finalResult.message || 'Payment failed.');
      }
    } catch (error) {
      if (popupRunRef.current === runId) {
        setPopupStep('failed');
        setPopupMessage(error?.message || 'Payment verification failed.');
      }
    } finally {
      if (popupRunRef.current === runId) {
        setSubmitting(false);
      }
    }
  }"""
          one(old_submit, new_submit, 'submitPopup')

          if s.count('popupRunRef') < 5:
              raise SystemExit('Patch verification failed: popupRunRef not applied')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit hotfix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gateway-client-hotfix.yml
          git add src/main.jsx
          git diff --cached --check
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Fix brand edit and checkout popup polling"
          git push
