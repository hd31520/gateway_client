<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Merchant Demo - Gateway Widget</title>
</head>
<body>
  <h1>Merchant Demo</h1>
  <p>This page demonstrates including the hosted Gateway widget.</p>
  <button id="payBtn">Pay ৳500</button>
  <pre id="out"></pre>

  <script>
    // Adjust host if gateway server is on a different origin
    const GATEWAY_HOST = 'http://localhost:3000';
    const script = document.createElement('script');
    script.src = GATEWAY_HOST + '/widget.js';
    script.onload = () => {
      document.getElementById('payBtn').addEventListener('click', () => {
        GatewayWidget.open({ amount: 500, callback: 'http://localhost:5173/merchant-demo-callback.html', onComplete: (r) => {
          document.getElementById('out').textContent = JSON.stringify(r, null, 2);
        }});
      });
    };
    document.head.appendChild(script);

    // Optional: listen for postMessage too
    window.addEventListener('message', (e) => {
      document.getElementById('out').textContent = 'postMessage: ' + JSON.stringify(e.data, null, 2);
    });
  </script>
</body>
</html>
